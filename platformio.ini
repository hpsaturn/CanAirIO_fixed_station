;
; For full documentation of this CanAirIO project:
; https://github.com/hpsaturn/CanAirIO_fixed_station#canairio-fixed-station
;
; Please visit PlatformIO documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html


[platformio]
default_envs = NODEMCUV2

[common]
platform = espressif32 @ 4.4.0
framework = arduino
upload_speed = 1500000
monitor_speed = 115200
version = 0.1.1
revision = 100
target = dev
monitor_filters = time
extra_scripts = pre:prebuild.py
build_flags =
    -D CORE_DEBUG_LEVEL=0
lib_deps = 
    https://github.com/hpsaturn/WiFiManager.git#development
    bblanchon/ArduinoJson @ 6.21.6
    https://github.com/tobiasschuerg/InfluxDB-Client-for-Arduino.git
    adafruit/Adafruit Unified Sensor@1.1.14
    https://github.com/adafruit/Adafruit_BMP280_Library.git#2.6.1
    https://github.com/adafruit/Adafruit_BME680.git#2.0.1
    https://github.com/adafruit/Adafruit_BusIO.git#12e4ddb
    https://github.com/adafruit/Adafruit_SHT31.git#2.0.0
    https://github.com/RobTillaart/AM232X.git#0.4.1
    https://github.com/WifWaf/MH-Z19.git#1.5.4
    https://github.com/sparkfun/SparkFun_SCD30_Arduino_Library.git#v1.0.17
    https://github.com/paulvha/sps30.git#1425d26
    https://github.com/kike-canaries/canairio_sensorlib.git#v0.5.4

[env:CCP_ESP32]                ; CanAirIO Captive Portal ESP32 version, 
platform = espressif32@4.4.0   ; for possible confusions with official CanAirIO ESP32 version
board = lolin32
framework = ${common.framework}
upload_speed = ${common.upload_speed}
monitor_speed = ${common.monitor_speed}
extra_scripts = ${common.extra_scripts}
build_flags =
      ${common.build_flags}
      -D TTGO_T7=1
lib_deps = 
      ${common.lib_deps}
      ESP32Ping

[env:NODEMCUV2]
platform = espressif8266
framework = ${common.framework}
board = nodemcuv2
monitor_speed = ${common.monitor_speed}
extra_scripts = ${common.extra_scripts}
build_flags =
      ${common.build_flags}
lib_deps = 
      ${common.lib_deps}
      ESP8266Ping

[env:ESP12E]
platform = espressif8266
framework = ${common.framework}
board = esp12e
monitor_speed = ${common.monitor_speed}
extra_scripts = ${common.extra_scripts}
build_flags =
      ${common.build_flags}
lib_deps = 
      ${common.lib_deps}
      ESP8266Ping
